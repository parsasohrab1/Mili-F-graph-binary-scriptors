# Phase 3 - FR-1: BNN Binary Descriptor Extraction

phase3:
  bnn:
    enabled: true
    # Transport to Product 1 BNN chip:
    #   simulated | loopback — dev/CI (protocol loopback)
    #   spidev           — Linux /dev/spidev{bus}.{cs}
    #   serial           — USB-UART bridge (set serial_port)
    transport: simulated
    target_time_us: 1500  # chip budget for sim (< 2 ms SRS)
    spi:
      bus_id: 0
      cs_pin: 0
      clock_hz: 20000000
      dma_channel: 1
      mode: 0
      device_path: ""  # optional override e.g. /dev/spidev0.0
    serial_port: ""    # e.g. COM3 or /dev/ttyUSB0
    serial_baud: 2000000
    protocol_version: 1
    max_keypoints: 200
    descriptor_bits: 128
    image_width: 640
    image_height: 480
  fallback:
    enabled: true
    descriptor_type: orb  # orb | brief
    auto_select: true
  matching:
    hamming_threshold: 50
    ratio_test: 0.75
    use_popcount_lut: true
  acceptance:
    extraction_time_ms: 2.0
    repeatability_pct: 90.0
    energy_mj_per_frame: 5.0
  energy_model:
    base_mj: 0.5
    per_keypoint_mj: 0.02
    per_bit_mj: 0.001
