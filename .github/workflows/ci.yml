name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vio]"

      - name: Run fast tests
        run: |
          python -m pytest tests/ -m "not slow" -v --tb=short

  embedded-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build embedded host sim (CMake)
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            powershell -ExecutionPolicy Bypass -File embedded/scripts/build.ps1 -Test
          } else {
            Write-Host "cmake not available — skipping embedded smoke"
          }

  slow-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,vio]"

      - name: Phase 6 quick validation
        run: mili-vio-validate --quick --skip-embedded
